<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JaalTaka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --off: #fafaf9;
      --stone: #f5f4f0;
      --border: #e8e6e0;
      --border2: #d4d1c8;
      --ink: #1c1917;
      --ink2: #44403c;
      --muted: #a8a29e;
      --dim: #c8c4bc;
      --real: #15803d;
      --real-light: #dcfce7;
      --real-mid: #86efac;
      --fake: #b91c1c;
      --fake-light: #fee2e2;
      --fake-mid: #fca5a5;
      --gold: #d4a853;
      --gold-light: #fef9ee;
      --shadow-sm: 0 1px 3px rgba(28,25,23,0.06), 0 1px 2px rgba(28,25,23,0.04);
      --shadow-md: 0 4px 16px rgba(28,25,23,0.08), 0 2px 6px rgba(28,25,23,0.05);
      --shadow-lg: 0 20px 60px rgba(28,25,23,0.1), 0 8px 24px rgba(28,25,23,0.06);
      --shadow-xl: 0 32px 80px rgba(28,25,23,0.14), 0 12px 32px rgba(28,25,23,0.08);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--off);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 3rem;
      background: rgba(250,250,249,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--ink);
      display: flex;
      align-items: baseline;
      gap: 0.15rem;
    }
    .nav-logo .mark {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
      margin-left: 2px;
      margin-bottom: 2px;
      flex-shrink: 0;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .nav-pill {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--stone);
      border: 1px solid var(--border);
      padding: 0.3rem 0.8rem;
      border-radius: 99px;
    }
    .hero {
      max-width: 900px;
      margin: 0 auto;
      padding: 5rem 3rem 3rem;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 2rem;
      animation: fadeUp 0.7s ease both;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 6vw, 5.5rem);
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -0.03em;
      color: var(--ink);
      /* subtle entrance animation and hover lift */
      animation: heroPop 0.9s cubic-bezier(0.2, 0.9, 0.2, 1) both;
      transition: transform 0.18s ease, text-shadow 0.18s ease;
      transform-origin: left bottom;
    }
    .hero-title em {
      font-style: italic;
      color: var(--gold);
    }

    .hero-sub {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
      max-width: 180px;
      text-align: right;
      font-weight: 400;
    }
    .stats-strip {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 3rem 3rem;
      display: flex;
      gap: 0;
      border-top: 1px solid var(--border);
      animation: fadeUp 0.7s 0.1s ease both;
    }
    .stat-cell {
      flex: 1;
      padding: 1.2rem 0;
      border-right: 1px solid var(--border);
      padding-right: 2rem;
      padding-left: 2rem;
    }
    .stat-cell:first-child { padding-left: 0; }
    .stat-cell:last-child { border-right: none; }
    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .stat-lbl {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 3rem 6rem;
    }
    .upload-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      margin-bottom: 1.5rem;
      animation: fadeUp 0.7s 0.2s ease both;
      position: relative;
    }

    .upload-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 180px; height: 180px;
      background: radial-gradient(ellipse at top right, rgba(212,168,83,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .drop-zone {
      padding: 3.5rem 3rem;
      cursor: pointer;
      transition: background 0.2s ease;
      position: relative;
    }
    .drop-zone:hover { background: var(--stone); }
    .drop-zone.dragover { background: var(--gold-light); }
    .drop-zone input { display: none; }

    .dz-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1rem;
    }

    .dz-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 1.5px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      box-shadow: var(--shadow-sm);
      transition: all 0.25s ease;
      position: relative;
    }
    .dz-circle svg { transition: transform 0.25s ease; }
    .drop-zone:hover .dz-circle {
      border-color: var(--gold);
      box-shadow: 0 0 0 6px rgba(212,168,83,0.08), var(--shadow-md);
    }
    .drop-zone:hover .dz-circle svg { transform: translateY(-3px); }
    .drop-zone.dragover .dz-circle { border-color: var(--gold); background: var(--gold-light); }

    .dz-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .dz-sub {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 300;
    }
    .dz-sub strong { color: var(--gold); font-weight: 500; cursor: pointer; }

    .upload-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-top: 1px solid var(--border);
      background: var(--stone);
    }
    .upload-bar-left {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .upload-bar-left strong { color: var(--ink2); }

    .btn-analyze {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.5rem;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 99px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.01em;
    }
    .btn-analyze:hover:not(:disabled) {
      background: var(--ink2);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(28,25,23,0.2);
    }
    .btn-analyze:active:not(:disabled) { transform: translateY(0); }
    .btn-analyze:disabled {
      background: var(--dim);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-clear {
      background: none;
      border: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      transition: all 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .btn-clear:hover:not(:disabled) { color: var(--fake); background: var(--fake-light); }
    .btn-clear:disabled { opacity: 0.3; cursor: not-allowed; }
    #imageGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.75rem;
      padding: 0 2rem 1.5rem;
    }
    #imageGrid:empty { display: none; }

    .img-card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 4/3;
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .img-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes heroPop {
      from { opacity: 0; transform: translateY(10px) scale(0.99); filter: blur(2px); }
      to   { opacity: 1; transform: translateY(0) scale(1); filter: none; }
    }

    .img-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .img-remove {
      position: absolute;
      top: 6px; right: 6px;
      width: 22px; height: 22px;
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--muted);
      font-size: 0.6rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      box-shadow: var(--shadow-sm);
      opacity: 0;
    }
    .img-card:hover .img-remove { opacity: 1; }
    .img-remove:hover { background: var(--fake-light); color: var(--fake); border-color: var(--fake-mid); }

    .img-overlay {
      position: absolute; inset: 0;
      background: rgba(250,250,249,0.75);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s;
      backdrop-filter: blur(2px);
    }
    .img-card.analyzing .img-overlay { opacity: 1; }

    .spinner {
      width: 22px; height: 22px;
      border: 2px solid var(--border2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .img-badge {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 0.35rem 0.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.58rem;
      font-weight: 500;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .img-card.done .img-badge { opacity: 1; }
    .img-card.result-real .img-badge { background: rgba(220,252,231,0.95); color: var(--real); backdrop-filter: blur(4px); }
    .img-card.result-fake .img-badge { background: rgba(254,226,226,0.95); color: var(--fake); backdrop-filter: blur(4px); }
    #resultsSection { display: none; animation: fadeUp 0.5s ease both; }
    #resultsSection.visible { display: block; }

    .results-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }
    .results-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .results-sub {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .summary-triptych {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-md);
    }

    .tri-panel {
      padding: 2rem;
      background: var(--white);
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--border);
      transition: background 0.2s;
    }
    .tri-panel:last-child { border-right: none; }
    .tri-panel::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
    }
    .tri-panel.total::after { background: linear-gradient(90deg, var(--border2), transparent); }
    .tri-panel.authentic::after { background: linear-gradient(90deg, var(--real), var(--real-mid)); }
    .tri-panel.counterfeit::after { background: linear-gradient(90deg, var(--fake), var(--fake-mid)); }

    .tri-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .tri-panel.total .tri-icon { background: var(--stone); }
    .tri-panel.authentic .tri-icon { background: var(--real-light); }
    .tri-panel.counterfeit .tri-icon { background: var(--fake-light); }

    .tri-val {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .tri-panel.total .tri-val { color: var(--ink); }
    .tri-panel.authentic .tri-val { color: var(--real); }
    .tri-panel.counterfeit .tri-val { color: var(--fake); }

    .tri-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    #resultList { display: flex; flex-direction: column; gap: 0.75rem; }

    .result-item {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.25rem 1.5rem;
      display: grid;
      grid-template-columns: 64px 1fr auto;
      align-items: center;
      gap: 1.25rem;
      animation: slideIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }
    .result-item:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .result-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 0 2px 2px 0;
    }
    .result-item.result-real::before { background: var(--real); }
    .result-item.result-fake::before { background: var(--fake); }

    .result-item.result-real { background: linear-gradient(135deg, rgba(220,252,231,0.15) 0%, var(--white) 40%); }
    .result-item.result-fake { background: linear-gradient(135deg, rgba(254,226,226,0.15) 0%, var(--white) 40%); }

    .result-thumb {
      width: 64px; height: 48px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .result-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .r-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.5rem;
    }

    .prob-rows { display: flex; flex-direction: column; gap: 5px; }
    .prob-row-item { display: flex; align-items: center; gap: 0.5rem; }
    .p-lbl {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      width: 26px; flex-shrink: 0;
    }
    .p-track {
      flex: 1;
      height: 5px;
      background: var(--stone);
      border-radius: 99px;
      overflow: hidden;
    }
    .p-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    .p-fill.real { background: linear-gradient(90deg, var(--real), #4ade80); }
    .p-fill.fake { background: linear-gradient(90deg, var(--fake), #f87171); }
    .p-pct {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      width: 32px;
      text-align: right;
    }

    .result-verdict {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .v-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      padding: 0.3rem 0.8rem;
      border-radius: 99px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .v-badge.real { background: var(--real-light); color: var(--real); border: 1px solid var(--real-mid); }
    .v-badge.fake { background: var(--fake-light); color: var(--fake); border: 1px solid var(--fake-mid); }

    .v-conf {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .result-item.result-real .v-conf { color: var(--real); }
    .result-item.result-fake .v-conf { color: var(--fake); }
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--white);
    }
    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .footer-right {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      color: var(--dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .toast {
      display: none;
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%);
      background: var(--white);
      border: 1px solid var(--fake-mid);
      color: var(--fake);
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      font-size: 0.78rem;
      font-family: 'DM Mono', monospace;
      z-index: 300;
      box-shadow: var(--shadow-lg);
    }
    .toast.show { display: block; animation: fadeUp 0.3s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 680px) {
      nav, footer { padding: 1rem 1.5rem; }
      .hero { padding: 3rem 1.5rem 2rem; grid-template-columns: 1fr; }
      .hero-sub { text-align: left; max-width: 100%; }
      .stats-strip { padding: 0 1.5rem 2rem; gap: 0; }
      .stat-cell { padding: 1rem 1rem; }
      .content { padding: 0 1.5rem 4rem; }
      .drop-zone { padding: 2.5rem 1.5rem; }
      #imageGrid { padding: 0 1.5rem 1.25rem; }
      .upload-bar { padding: 0.9rem 1.5rem; }
      .summary-triptych { grid-template-columns: 1fr; }
      .tri-panel { border-right: none; border-bottom: 1px solid var(--border); }
      .tri-panel:last-child { border-bottom: none; }
      .result-item { grid-template-columns: 52px 1fr auto; gap: 0.9rem; padding: 1rem 1.1rem; }
      .r-name { max-width: 120px; }
    }
  </style>
</head>
<body>
<nav>
  <div class="nav-logo">JaalTaka<span class="mark"></span></div>
  <div class="nav-right">
    <span class="nav-pill">Banknote · AI Detector</span>
  </div>
</nav>
<div class="hero">
  <div>
    <div class="hero-title">Verify <em>authentic</em>&nbsp;banknotes.</div>
  </div>

</div>
<div class="content">
  <div class="upload-card">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" multiple />
      <div class="dz-inner">
        <div class="dz-circle">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <div>
          <div class="dz-title">Drop images here</div>
          <div class="dz-sub">or <strong onclick="document.getElementById('fileInput').click()">browse files</strong> — JPG, PNG, WEBP</div>
        </div>
      </div>
    </div>
    <div id="imageGrid"></div>
    <div class="upload-bar">
      <div class="upload-bar-left" id="fileCount">No files selected</div>
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <button class="btn-clear" id="clearBtn" disabled>Clear</button>
        <button class="btn-analyze" id="analyzeBtn" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Analyze
        </button>
      </div>
    </div>
  </div>
  <div id="resultsSection">
    <div class="results-header">
      <div class="results-title">Results</div>
      <div class="results-sub" id="resultsMeta"></div>
    </div>

    <div class="summary-triptych">
      <div class="tri-panel total">
        <div class="tri-icon">📋</div>
        <div class="tri-val" id="sumTotal">0</div>
        <div class="tri-label">Analyzed</div>
      </div>
      <div class="tri-panel authentic">
        <div class="tri-icon">✓</div>
        <div class="tri-val" id="sumReal">0</div>
        <div class="tri-label">Authentic</div>
      </div>
      <div class="tri-panel counterfeit">
        <div class="tri-icon">✕</div>
        <div class="tri-val" id="sumFake">0</div>
        <div class="tri-label">Counterfeit</div>
      </div>
    </div>

    <div id="resultList"></div>
  </div>

</div>
<footer>
  <div class="footer-logo">JaalTaka</div>
  <div class="footer-right">AI · BanknoteCNN · v1.0</div>
</footer>

<div class="toast" id="toast"></div>

<script>
  const dropZone   = document.getElementById('dropZone');
  const fileInput  = document.getElementById('fileInput');
  const imageGrid  = document.getElementById('imageGrid');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const clearBtn   = document.getElementById('clearBtn');
  const fileCount  = document.getElementById('fileCount');
  const resultsSection = document.getElementById('resultsSection');
  const resultList = document.getElementById('resultList');
  const toast      = document.getElementById('toast');

  let files = [], idCounter = 0;

  dropZone.addEventListener('click', e => { if (e.target.tagName !== 'STRONG') fileInput.click(); });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); addFiles([...e.dataTransfer.files]); });
  fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });

  function addFiles(newFiles) {
    const imgs = newFiles.filter(f => f.type.startsWith('image/'));
    if (!imgs.length) return;
    imgs.forEach(f => {
      const id = ++idCounter;
      const entry = { file: f, id, dataUrl: null };
      files.push(entry);
      const card = createCard(entry);
      imageGrid.appendChild(card);
      const reader = new FileReader();
      reader.onload = e => { entry.dataUrl = e.target.result; card.querySelector('img').src = e.target.result; };
      reader.readAsDataURL(f);
    });
    updateUI();
  }

  function createCard(entry) {
    const card = document.createElement('div');
    card.className = 'img-card';
    card.dataset.id = entry.id;
    card.style.animationDelay = `${(files.length - 1) * 0.04}s`;
    card.innerHTML = `
      <img src="" alt="${entry.file.name}" />
      <button class="img-remove" title="Remove">✕</button>
      <div class="img-overlay"><div class="spinner"></div></div>
      <div class="img-badge"></div>`;
    card.querySelector('.img-remove').addEventListener('click', e => { e.stopPropagation(); removeFile(entry.id); });
    return card;
  }

  function removeFile(id) {
    files = files.filter(f => f.id !== id);
    imageGrid.querySelector(`[data-id="${id}"]`)?.remove();
    updateUI();
  }

  function updateUI() {
    const n = files.length;
    analyzeBtn.disabled = n === 0;
    clearBtn.disabled = n === 0;
    fileCount.innerHTML = n > 0 ? `<strong>${n}</strong> image${n > 1 ? 's' : ''} ready` : 'No files selected';
  }

  clearBtn.addEventListener('click', () => {
    files = []; imageGrid.innerHTML = '';
    resultsSection.classList.remove('visible');
    resultList.innerHTML = '';
    updateUI();
  });

  analyzeBtn.addEventListener('click', async () => {
    if (!files.length) return;
    analyzeBtn.disabled = true;
    clearBtn.disabled = true;
    analyzeBtn.innerHTML = `<div class="spinner" style="width:13px;height:13px;border-width:1.5px;border-color:rgba(255,255,255,0.25);border-top-color:#fff"></div> Analyzing…`;

    resultsSection.classList.add('visible');
    resultList.innerHTML = '';
    let realCount = 0, fakeCount = 0;

    imageGrid.querySelectorAll('.img-card').forEach(c => {
      c.classList.remove('done', 'result-real', 'result-fake', 'analyzing');
      c.querySelector('.img-badge').textContent = '';
    });

    for (const entry of files) {
      const card = imageGrid.querySelector(`[data-id="${entry.id}"]`);
      card?.classList.add('analyzing');
      try {
        const form = new FormData();
        form.append('file', entry.file);
        const res  = await fetch('/api/predict', { method: 'POST', body: form });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { throw new Error(text.slice(0, 100)); }
        if (!res.ok) throw new Error(data.detail || `Error ${res.status}`);

        const label = data.label;
        if (label === 'real') realCount++; else fakeCount++;

        if (card) {
          card.classList.remove('analyzing');
          card.classList.add('done', `result-${label}`);
          card.querySelector('.img-badge').textContent = label === 'real' ? '✓ Authentic' : '✕ Counterfeit';
        }
        appendResult(entry, data);
      } catch (err) {
        card?.classList.remove('analyzing');
        showToast(err.message);
      }
    }

    document.getElementById('sumTotal').textContent  = realCount + fakeCount;
    document.getElementById('sumReal').textContent   = realCount;
    document.getElementById('sumFake').textContent   = fakeCount;
    document.getElementById('resultsMeta').textContent = `${realCount + fakeCount} processed`;

    analyzeBtn.disabled = false;
    clearBtn.disabled = false;
    analyzeBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> Analyze`;
    resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function appendResult(entry, data) {
    const label = data.label;
    const conf  = (data.confidence * 100).toFixed(1);
    const probs = data.probabilities;
    const item  = document.createElement('div');
    item.className = `result-item result-${label}`;
    item.style.animationDelay = `${resultList.children.length * 0.06}s`;

    const probBars = Object.entries(probs).map(([k, v]) => `
      <div class="prob-row-item">
        <span class="p-lbl">${k}</span>
        <div class="p-track"><div class="p-fill ${k}" style="width:${(v*100).toFixed(1)}%"></div></div>
        <span class="p-pct">${(v*100).toFixed(1)}%</span>
      </div>`).join('');

    item.innerHTML = `
      <div class="result-thumb">${entry.dataUrl ? `<img src="${entry.dataUrl}" alt="">` : ''}</div>
      <div>
        <div class="r-name">${entry.file.name}</div>
        <div class="prob-rows">${probBars}</div>
      </div>
      <div class="result-verdict">
        <span class="v-badge ${label}">${label === 'real' ? '✓ Authentic' : '✕ Fake'}</span>
        <span class="v-conf">${conf}%</span>
      </div>`;
    resultList.appendChild(item);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
  }
</script>
</body>
</html>
